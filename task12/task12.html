<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <div>
            <input type="text" id="idname" placeholder="Name">
        </div>
        <div>
            <input type="text" id="idage" placeholder="Age">
        </div>
        <div>
           <button onclick="datainfo()">Submit</button>
        </div>
    </div>
</body>

<script>
    function datainfo() {
        const name = document.getElementById("idname").value;
        const age = document.getElementById("idage").value;
        const time = new Date().toLocaleString(); 

       
        const userinfo = {
            name: name,
            age: age,
            time: time
        };

        const { name: username, age: userage, time: timelocal } = userinfo;

        alert(`Your name is: ${username}\nYour age is: ${userage}\nTimes: ${timelocal}`);
    }
</script>

</html>
